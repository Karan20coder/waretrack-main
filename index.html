<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="WareTrack: a 3D warehouse strategy game you play in the browser.">
  <title>WareTrack Logistics</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5be0'/%3E%3Cpath d='M32 12 50 22v20L32 52 14 42V22z' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%232f5be0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    body {
      margin: 0
    }

    img {
      max-width: 100%
    }

    [hidden] {
      display: none !important
    }
  </style>
</head>

<body>

  <div id="stage"></div>
  <div class="loading" id="loading">Opening the yard…</div>
  <div id="fx"></div>
  <canvas id="confetti"></canvas>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="hud" id="hud" hidden>
    <header class="bar glass">
      <button class="brand" id="brand" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 3 7v10l9 5 9-5V7z" fill="#2f5be0" />
          <path d="M12 12 3 7l9-5 9 5z" fill="#6f8ff0" />
          <path d="M12 12v10l9-5V7z" fill="#1e43b8" />
        </svg>
        WareTrack
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
          stroke-linecap="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <label class="search" for="q">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input id="q" type="search" placeholder="Search trucks, forklifts, SKUs…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="spacer"></div>
      <button class="site" id="siteChip" aria-haspopup="true"><span class="code" id="siteCode">WH-01</span>
        <div><b id="siteName">Warehouse 1</b><small id="siteSub">—</small></div><svg class="chev" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <div class="clock" id="clockPill"><span class="dot"></span><span class="lbl" id="clockLbl">Live</span><b
          id="clock">08:00</b><span class="left" id="clockLeft"></span><i class="prog" id="clockProg"></i></div>
      <div class="combo" id="comboChip" hidden><span id="comboX">×1.25</span><small>combo</small><span class="pips"
          id="comboPips"></span></div>
      <div class="score free" id="scoreChip"><label>Score</label><b id="score">Free play</b></div>
      <div class="speed" role="group" aria-label="Simulation speed">
        <button id="sp0" data-s="0" aria-label="Pause" aria-pressed="false"><svg viewBox="0 0 24 24"
            fill="currentColor">
            <rect x="6" y="5" width="4" height="14" rx="1" />
            <rect x="14" y="5" width="4" height="14" rx="1" />
          </svg></button>
        <button id="sp1" data-s="1" aria-pressed="true">1×</button>
        <button id="sp3" data-s="3" aria-pressed="false">3×</button>
      </div>
      <button class="ibtn" id="townBtn" aria-pressed="false" title="Town planner (T)"><svg viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z" />
          <path d="M9 4v14M15 6v14" />
        </svg><span>Town</span></button>
      <button class="ibtn" id="buildBtn" aria-pressed="false" title="Build mode (B)"><svg viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14 6 4 4M3 21l9-9M12.5 4.5 16 1l7 7-3.5 3.5z" />
          <path d="m11 13 3-3" />
        </svg><span>Build</span></button>
      <button class="ibtn bell" id="bellBtn" aria-label="Notifications" aria-haspopup="true"><svg viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7" />
          <path d="M10 20a2 2 0 0 0 4 0" />
        </svg><span class="bdg" id="bellN" hidden>0</span></button>
      <button class="ibtn" id="soundBtn" aria-label="Sound on" title="Sound"><svg id="soundIc" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7" />
        </svg></button>
      <button class="lvl" id="lvlChip" aria-label="Profile"><span class="n" id="lvlN">1</span><span class="who"><b
            id="lvlRank">Trainee</b><small id="lvlSub">Level 1</small><span class="xp"><i
              id="lvlXp"></i></span></span></button>
      <button class="call" id="callTruck" title="Book an extra inbound truck">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg><span>Call truck</span>
      </button>
    </header>

    <section class="kpis" id="kpis">
      <div class="kpi glass">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linejoin="round">
            <path d="M12 3 4 7.5v9L12 21l8-4.5v-9z" />
            <path d="m4 7.5 8 4.5 8-4.5M12 12v9" />
          </svg></div>
        <div><label>Stock on hand</label>
          <div class="v"><span id="kStock">0</span><span class="d" id="kStockD"></span></div><small
            id="kStockS">units</small>
        </div>
      </div>
      <div class="kpi glass">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M3 7h11v9H3zM14 10h4l3 3v3h-7" />
            <circle cx="7" cy="17.5" r="1.8" />
            <circle cx="17" cy="17.5" r="1.8" />
          </svg></div>
        <div><label>Trucks on site</label>
          <div class="v"><span id="kTrucks">0</span><span class="d" id="kTrucksD"></span></div><small
            id="kTrucksS">—</small>
        </div>
      </div>
      <div class="kpi glass">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg></div>
        <div><label>Orders on time</label>
          <div class="v"><span id="kOnTime">—</span></div><small id="kOnTimeS">this shift</small>
        </div>
      </div>
      <div class="kpi glass">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M4 20V4M4 20h16M4 14h6v6M10 9h6v11M16 4h4v16" />
          </svg></div>
        <div style="min-width:96px"><label>Rack occupancy</label>
          <div class="v"><span id="kOcc">0</span></div>
          <div class="meter" id="kOccM"><i></i></div>
        </div>
      </div>
    </section>

    <div class="leftcol">
      <section class="shift glass" id="shift"></section>
      <section class="missions glass" id="missions"></section>
      <section class="incident glass" id="incident" hidden></section>
      <section class="acts glass" id="acts"></section>
    </div>

    <div class="dd glass" id="siteDD" hidden></div>
    <div class="dd glass" id="bellDD" hidden></div>
    <div class="buildbar glass" id="townbar" hidden><b>Town planner</b><span>Pick a tool, then tap plots on the
        map</span><button class="act" id="townUndo">Undo</button><button class="act solid" id="townDone">Done</button>
    </div>
    <div class="buildbar glass" id="buildbar" hidden><b>Build mode</b><span>Tap a glowing plot or pick from the
        list</span><button class="act solid" id="buildDone">Done</button></div>

    <div class="cam glass" role="group" aria-label="Camera">
      <button class="zoom" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg></button>
      <button class="zoom" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round">
          <path d="M5 12h14" />
        </svg></button>
      <hr class="zoom">
      <button id="rotL" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12a8 8 0 1 0 2.4-5.7" />
          <path d="M4 4v4h4" />
        </svg></button>
      <button id="rotR" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12a8 8 0 1 1-2.4-5.7" />
          <path d="M20 4v4h-4" />
        </svg></button>
      <button id="home" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linejoin="round">
          <path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" />
        </svg></button>
    </div>

    <section class="insp glass" id="insp" aria-live="polite" hidden style="display:none!important"></section>
    <aside class="panel glass" id="panel">
      <div class="p-head" id="pHead">
        <div class="handle"></div>
        <div class="eyebrow" id="pEyebrow">Distribution center · WH-01</div>
        <div class="p-title">
          <h2 id="pName">Warehouse 1</h2>
          <p id="pAddr">—</p>
        </div>
        <div class="chips" id="chips"></div>
        <div class="tabs" role="tablist">
          <button role="tab" id="t-ord" data-tab="ord" aria-selected="true">Orders <span class="count"
              id="cOrd">0</span></button>
          <button role="tab" id="t-dock" data-tab="dock" aria-selected="false">Docks <span class="count"
              id="cDock">0</span></button>
          <button role="tab" id="t-fl" data-tab="fl" aria-selected="false">Forklifts <span class="count"
              id="cFl">0</span></button>
          <button role="tab" id="t-tk" data-tab="tk" aria-selected="false">Trucks <span class="count"
              id="cTk">0</span></button>
          <button role="tab" id="t-van" data-tab="van" aria-selected="false">Vans <span class="count"
              id="cVan">0</span></button>
          <button role="tab" id="t-inv" data-tab="inv" aria-selected="false">Stock</button>
          <button role="tab" id="t-log" data-tab="log" aria-selected="false">Log</button>
        </div>
      </div>
      <div class="p-body" id="pBody"></div>
    </aside>

    <section class="track glass" id="track"></section>
    <div class="hint" id="hint">Drag to pan · scroll or pinch to zoom · tap a truck or forklift</div>
  </div>
  <div class="coach glass" id="coach" hidden></div>
  <div class="tag3d" id="tag3d" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="WareTrack menu"></div>
  </div>

      barriers.forEach(b => { const tn = t => Math.hypot(wx(t) - 21.6 - b.ox, t.z - b.pz) < 9.5; const near = b.kind === 'tk' ? (trucks.some(tn) || liteTrucks.some(tn)) : vans.some(v => Math.hypot(v.x - 12 - b.ox, v.z - b.pz) < 5.5); b.open += clamp((near ? 1 : 0) - b.open, -rdt * 1.6, rdt * 1.6); b.arm.rotation.z = b.dir * b.open * 1.35; });
      if (town.pins) { const pv = view.zoom < 0.4, ps = Math.min(3, 0.13 / view.zoom) * 46; town.pins.forEach(p => { p.visible = pv && !game.town; p.scale.set(ps, ps * 140 / 640, 1); }); }
      if (shell.g) {
        const tgt = (view.zoom < 0.72 || game.town) ? 1 : 0;
        shell.op += (tgt - shell.op) * Math.min(1, rdt * 5);
        const o = shell.op;
        shell.mats.forEach(m => { m.opacity = o; m.depthWrite = o > 0.95; });
        shell.g.visible = o > 0.02;
      }
      lites.forEach(Lt => {
        if (Lt.shell) {
          const dist = Math.abs(view.target.x - Lt.ox);
          const tgt = (dist < 26 && view.zoom >= 0.72 && !game.town) ? 0 : 1;
          Lt.shellOp = Lt.shellOp != null ? Lt.shellOp : 1;
          Lt.shellOp += (tgt - Lt.shellOp) * Math.min(1, rdt * 5);
          const o = Lt.shellOp;
          (Lt.shellMats || []).forEach(m => { m.opacity = o; m.depthWrite = o > 0.95; });
          Lt.shell.visible = o > 0.02;
        }
      });
      for (let i = pops.length - 1; i >= 0; i--) {
        const p = pops[i]; p.t += rdt;
        if (p.t > 1.5) { p.el.remove(); pops.splice(i, 1); continue; }
        tmpV.copy(p.p).project(cam);
        p.el.style.transform = 'translate(' + ((tmpV.x + 1) / 2 * innerWidth) + 'px,' + ((1 - tmpV.y) / 2 * innerHeight - p.t * 34) + 'px) translate(-50%,-100%)';
        p.el.style.opacity = String(p.t < 1 ? 1 : 1 - (p.t - 1) / .5);
      }
      updateCars(rdt * (sim.speed ? Math.min(sim.speed, 2) : 0.5)); updateVans(dt); if (dt > 0) townAccrue(dt); updateTownHover();
      stepConfetti(rdt);
      Snd.music();
      renderer.render(scene, cam);
      $('#clock').textContent = fmtT(clockMin());
      hudT += rdt;
      if (hudT > 0.4 || dirty) { hudT = 0; dirty = false; renderKpis(); renderShift(); renderPanel(); renderTrack(); renderInspector(); renderActs(); renderMissions(); if (town.built) renderCityBadges(); }
    }

    /* ---------------- boot ---------------- */
    function boot() {
      const unlockedIdx = SITES.map((_, i) => i).filter(unlocked);
      game.menuSel = unlockedIdx[unlockedIdx.length - 1] || 0;
      $('#loading').remove(); $('#hud').hidden = false;
      loadSite(game.menuSel);
      toast('ok', site.name + ' Active', 'Exclusive Item: ' + SKUS[site.sku].name + ' · All cartons orange', ICON.dock);
      addEventListener('resize', resize);
      setSpeed(1); renderIncident(); syncSoundBtn();
      game.menuTab = save.daily.last !== todayKey() && save.tutorial && save.stats.shifts > 0 ? 'daily' : 'play';
      welcomeBack(); setInterval(writeSave, 20000); document.addEventListener('visibilitychange', writeSave);
      setTimeout(hideHint, 14000);
      requestAnimationFrame(t => { last = t; tick(t); });
    }
    const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'), document.fonts.load('italic 800 40px "Bricolage Grotesque"'), document.fonts.load('600 20px Figtree')]).catch(() => { }) : Promise.resolve();
    Promise.race([fontsReady, new Promise(r => setTimeout(r, 1800))]).then(boot);
}) ();
  </script>
